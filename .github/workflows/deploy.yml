# Deploy via FTP para Hostinger.
#
# Dispara em cada push na branch main. Roda build (npm run build) que minifica
# HTML/CSS/JS de ed/ em dist/ed/, e sincroniza dist/ed/ para public_html/ed/
# no servidor via FTPS. Usa git-ftp interno — só transfere arquivos modificados
# desde o último deploy (mantém um arquivo `.ftp-deploy-sync-state-vN.json` no
# servidor pra controlar diff).
#
# Pré-requisitos: configure três secrets em
#   GitHub repo > Settings > Secrets and variables > Actions > New repository secret
#
#   FTP_SERVER     — hostname FTP do Hostinger (ex.: ftp.seudominio.com ou
#                    o host listado em hPanel > Arquivos > Contas FTP)
#   FTP_USERNAME   — usuário FTP (ex.: u123456789.deploy)
#   FTP_PASSWORD   — senha FTP
#
# Importante: o `.htaccess` da raiz de `public_html/` NÃO é tocado por este
# workflow (sobe somente o conteúdo de `dist/ed/`). Edite-o manualmente no servidor.

name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build + FTP sync dist/ed/ -> public_html/ed/
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (minify HTML/CSS/JS → dist/ed/)
        run: npm run build

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/ed/
          # No Hostinger compartilhado, ao logar via FTP o usuário cai em
          # /home/uXXXX/ e public_html fica em domains/xperiun.com/public_html.
          # O caminho aqui é relativo à raiz do FTP (sem /home/uXXXX).
          server-dir: /domains/xperiun.com/public_html/ed/
          # FTPS (TLS sobre porta 21, AUTH TLS explicit) é mais robusto que
          # FTP simples contra "Timeout (control socket)" — o Hostinger
          # derruba conexões FTP idle de ~30s, e re-deploys grandes deixam
          # o control socket esperando enquanto os data sockets sobem files.
          # FTPS mantém keepalives no TLS layer e sobrevive a transferências
          # longas.
          protocol: ftps
          port: 21
          # Timeout do client por operação. Default 30000ms → muito curto
          # pra full re-deploy. 60s dá folga em uploads grandes.
          timeout: 60000
          # state-name versionado: incrementa quando precisar forçar re-deploy
          # completo (action procura state pelo nome — se não achar, sobe tudo).
          # Útil quando um arquivo ficou dessincronizado no servidor.
          # v6: bump pq mudou source path (ed → dist/ed) — todos os arquivos
          # são "novos" do ponto de vista da action.
          state-name: .ftp-deploy-sync-state-v6.json
          # Por padrão a action já ignora .git e .github. Adicione exclusões
          # extras aqui se precisar (ex.: arquivos de dev, screenshots, etc.):
          # exclude: |
          #   **/*.bak
          #   **/.DS_Store
          log-level: standard
