# Deploy via lftp (FTPS explícito + size-based diff) para Hostinger.
#
# Por que NÃO SamKirkland/FTP-Deploy-Action:
#   - Action escreve state file (.ftp-deploy-sync-state.json) só no FIM do
#     deploy. Quando Hostinger derruba control socket no meio do upload
#     (timeout ~30s em transfers grandes), state nunca é escrito.
#   - Próximo deploy: state está vazio/antigo → action re-faz full upload →
#     timeout de novo. Loop infinito.
#
# Por que lftp:
#   - Sem state file. Mirror faz diff live a cada execução, comparando
#     local vs remoto direto.
#   - `--ignore-time`: compara só SIZE (não mtime). Minify de source
#     idêntico produz output idêntico em bytes → mesmo size → skip.
#     Só arquivos que realmente mudaram sobem.
#   - Reconexão automática + retry com backoff exponencial em falhas
#     do control socket.
#   - --parallel=2: 2 uploads simultâneos, suficiente sem sobrecarregar.

name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build + lftp sync dist/ed/ -> public_html/ed/
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build (minify HTML/CSS/JS → dist/ed/)
        run: npm run build

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Deploy via lftp (FTPS explícito + size-based diff)
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          # Escreve script lftp em arquivo separado pra evitar issues de
          # escaping no shell (passwords com $ ou aspas).
          cat > /tmp/lftp.cmd <<'LFTP_SCRIPT'
          set ssl:verify-certificate no
          set ftp:ssl-protect-data true
          set ftp:ssl-force true
          set ftp:ssl-auth TLS
          set ftp:passive-mode true
          set net:timeout 30
          set net:max-retries 5
          set net:reconnect-interval-base 5
          set net:reconnect-interval-multiplier 1.5
          set mirror:set-permissions false
          set cmd:fail-exit true
          pwd
          mirror \
            --reverse \
            --delete \
            --ignore-time \
            --verbose=1 \
            --parallel=2 \
            --exclude-glob '.ftp-deploy-sync-state-*.json' \
            dist/ed/ \
            /domains/xperiun.com/public_html/ed/
          bye
          LFTP_SCRIPT

          # -e: execute o script.
          # -u user,pass: credenciais (lftp escapa automaticamente).
          # ftp://host:21: explicit FTPS (set ftp:ssl-force true força TLS).
          lftp -e "source /tmp/lftp.cmd" -u "$FTP_USER,$FTP_PASS" "ftp://$FTP_HOST:21"
