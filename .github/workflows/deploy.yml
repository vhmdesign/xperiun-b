# Deploy via lftp para Hostinger.
#
# Dispara em cada push na branch main. Roda build (npm run build) que minifica
# HTML/CSS/JS de ed/ em dist/ed/, e sincroniza dist/ed/ para public_html/ed/
# no servidor via FTPS usando lftp.
#
# Por que lftp em vez de SamKirkland/FTP-Deploy-Action:
#   - Action anterior usava basic-ftp (Node lib) que tinha "Timeout (control
#     socket)" recorrente em Hostinger durante uploads grandes (>100 arquivos).
#   - lftp é o cliente FTP industrial — tem reconnect automático em idle
#     timeout, retry com backoff exponencial, e uploads paralelos. Lida bem
#     com Hostinger's idle disconnect de ~30s no control socket.
#
# Pré-requisitos: configure três secrets em
#   GitHub repo > Settings > Secrets and variables > Actions > New repository secret
#
#   FTP_SERVER     — hostname FTP do Hostinger (ex.: ftp.seudominio.com)
#   FTP_USERNAME   — usuário FTP (ex.: u123456789.deploy)
#   FTP_PASSWORD   — senha FTP
#
# Importante: o `.htaccess` da raiz de `public_html/` NÃO é tocado por este
# workflow (sync escopado em /public_html/ed/). Edite-o manualmente no servidor.
# lftp mirror --delete remove files do servidor que não existem em dist/ed/
# — válido pra /public_html/ed/ porque essa pasta é nossa exclusiva.

name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build + lftp sync dist/ed/ -> public_html/ed/
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build (minify HTML/CSS/JS → dist/ed/)
        run: npm run build

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy via lftp (FTPS)
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
          set ftp:ssl-protect-data true;
          set ftp:ssl-force true;
          set ftp:ssl-auth TLS;
          set ssl:verify-certificate no;
          set ftp:passive-mode true;
          set net:timeout 30;
          set net:max-retries 8;
          set net:reconnect-interval-base 5;
          set net:reconnect-interval-multiplier 1.5;
          set mirror:use-pget-n 2;
          set cmd:fail-exit true;
          open -u $FTP_USER,$FTP_PASS -p 21 $FTP_HOST;
          mirror \
            --reverse \
            --delete \
            --verbose=1 \
            --parallel=3 \
            --exclude-glob '.ftp-deploy-sync-state-*.json' \
            dist/ed/ \
            /domains/xperiun.com/public_html/ed/;
          "
