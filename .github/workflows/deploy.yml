# Deploy via FTPS para Hostinger com retry automático.
#
# Dispara em cada push na branch main. Roda build (npm run build) que minifica
# HTML/CSS/JS de ed/ em dist/ed/, e sincroniza dist/ed/ para public_html/ed/
# no servidor via FTPS.
#
# Por que retry de 3 tentativas:
#   - Hostinger derruba o control socket FTP em ~30s de inatividade durante
#     uploads grandes. Re-deploys completos (~200+ arquivos) sempre estouram
#     esse limite.
#   - SamKirkland/FTP-Deploy-Action escreve o state file (.ftp-deploy-sync-
#     state-vN.json) incrementalmente — cada arquivo uploadado é registrado
#     antes do próximo. Quando timeout acontece, o state preserva o progresso.
#   - Próxima tentativa pula tudo que já foi sincronizado e continua de onde
#     parou. 3 tentativas cobrem com folga até o full re-deploy mais lento.
#
# Pré-requisitos: configure três secrets em
#   GitHub repo > Settings > Secrets and variables > Actions > New repository secret
#
#   FTP_SERVER     — hostname FTP do Hostinger (ex.: ftp.seudominio.com)
#   FTP_USERNAME   — usuário FTP (ex.: u123456789.deploy)
#   FTP_PASSWORD   — senha FTP

name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build + FTPS sync (with retry) dist/ed/ -> public_html/ed/
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build (minify HTML/CSS/JS → dist/ed/)
        run: npm run build

      # ─────────────────────────────────────────────────────────────────
      # Attempt 1
      - name: Deploy via FTPS (attempt 1)
        id: deploy1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/ed/
          server-dir: /domains/xperiun.com/public_html/ed/
          protocol: ftps
          port: 21
          timeout: 60000
          state-name: .ftp-deploy-sync-state-v6.json
          log-level: standard

      - name: Wait 30s between attempts
        if: steps.deploy1.outcome == 'failure'
        run: sleep 30

      # ─────────────────────────────────────────────────────────────────
      # Attempt 2 (só se 1 falhar)
      - name: Deploy via FTPS (attempt 2)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/ed/
          server-dir: /domains/xperiun.com/public_html/ed/
          protocol: ftps
          port: 21
          timeout: 60000
          state-name: .ftp-deploy-sync-state-v6.json
          log-level: standard

      - name: Wait 60s between attempts
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 60

      # ─────────────────────────────────────────────────────────────────
      # Attempt 3 (último — sem continue-on-error pra falhar o job se também
      # falhar e o user receber notificação)
      - name: Deploy via FTPS (attempt 3 — final)
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/ed/
          server-dir: /domains/xperiun.com/public_html/ed/
          protocol: ftps
          port: 21
          timeout: 60000
          state-name: .ftp-deploy-sync-state-v6.json
          log-level: standard
