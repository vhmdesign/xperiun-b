# Deploy DESABILITADO em CI — Hostinger SSH está bloqueando IPs do
# GitHub Actions runner consistentemente (Connection timed out em todas
# as tentativas). Tentamos FTP, FTPS, rsync, retry — todos falham.
#
# Solução adotada: DEPLOY LOCAL via `npm run deploy` no PC do user.
# Conexão SSH do PC do user funciona normal — só o GA runner é bloqueado.
# Setup: copiar .env.example pra .env, preencher credenciais, rodar
# `npm run deploy`. Build + upload SFTP roda direto da máquina local
# (~30s pro full deploy).
#
# Esse workflow agora roda APENAS via trigger manual (workflow_dispatch).
# Push em main NÃO dispara mais auto-deploy — porque ia falhar mesmo.
#
# Se um dia voltarmos a confiar no CI (ex: Hostinger destravar, ou usar
# self-hosted runner), basta voltar o trigger `push: branches: [main]`.

name: Deploy to Hostinger (DESABILITADO — use npm run deploy local)

on:
  workflow_dispatch:  # só rodar manualmente quando user clicar "Run workflow"

jobs:
  deploy:
    name: Build + rsync (best-effort, geralmente falha)
    runs-on: ubuntu-latest

    steps:
      - name: Aviso
        run: |
          echo "::warning::Este workflow geralmente falha por bloqueio de IP"
          echo "::warning::do GitHub Actions runner pelo Hostinger SSH."
          echo "::warning::Use 'npm run deploy' local em vez disso."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build (minify HTML/CSS/JS → dist/ed/)
        run: npm run build

      - name: Install rsync + sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rsync sshpass

      - name: Deploy via rsync over SSH (best effort)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          set +e
          for attempt in 1 2 3; do
            echo "──────── Attempt $attempt of 3 ────────"
            sshpass -p "$SSH_PASS" rsync -rlptDvz --delete \
              -e "ssh -p $SSH_PORT -o ConnectTimeout=30 -o ServerAliveInterval=30 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
              dist/ed/ \
              "$SSH_USER@$SSH_HOST:~/domains/xperiun.com/public_html/ed/"
            EXIT=$?
            if [ $EXIT -eq 0 ]; then exit 0; fi
            if [ $attempt -lt 3 ]; then sleep $((attempt * 30)); fi
          done
          echo "::warning::CI deploy falhou (esperado). Rode 'npm run deploy' local."
          exit 1
