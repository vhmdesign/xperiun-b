<!--
     PÁGINA DE PASSAGEM DO CHECKOUT DA BLACK FRIDAY (/ed/bf/checkout/)

     Baseada na /ed/infinite-pass/checkout/. A AC redireciona o form 522
     (popup da /ed/bf/oferta/) pra cá, e o script manda a pessoa pro
     checkout da oferta repassando email, nome, telefone e UTMs. O
     checkout depende do momento (horário de Brasília):
       dentro de uma janela do +1 ano bônus (2 anos):
         https://go.xperiun.com/subscribe/app-ultra-oferta-novos-bf26
       fora delas (só 1 ano):
         https://go.xperiun.com/subscribe/app-ultra-oferta-novos-1ano-bf26
     As janelas moram em /ed/bf/dependencias/bonus.js, o mesmo calendário
     da copy da /ed/bf/oferta/.

     Diferente da do Infinite Pass, aqui não há consulta de aluno: o
     destino sai só da data, então não existe /api pra decidir.
     O link de saída manual e o <noscript> nascem no de 2 anos (sem JS a
     oferta também mostra a versão com bônus); com JS o script troca o
     link de saída pelo do momento.
-->
<div class="vit-glow" aria-hidden="true"></div>

<main class="bfc">

    <div class="vit-brand">
        <p class="bf-titulo" aria-label="Black Friday">
            <span class="bf-titulo-linha bf-titulo-linha--black">Black</span>
            <span class="bf-titulo-linha bf-titulo-linha--friday">Friday</span>
        </p>
        <span class="vit-brand-div" aria-hidden="true"></span>
        <img class="vit-brand-xp" src="/ed/site-dependencias/site-imagens/Base%20White%20Logo.svg"
             alt="Xperiun" width="107" height="32" fetchpriority="high" decoding="async">
    </div>

    <h1 class="bfc-title">Dados recebidos, estamos <span class="vit-em">garantindo sua oferta</span></h1>

    <!-- role="status" pro leitor de tela anunciar a espera; o spinner é
         decorativo e fica fora da árvore de acessibilidade. -->
    <p class="bfc-redirect" role="status">Em instantes você vai para o pagamento.</p>

    <span class="bfc-spinner" aria-hidden="true"></span>

    <!-- Saída manual. Nasce no link puro e o script põe os parâmetros nele
         logo na carga, pra quem clicar antes do redirect não perder nome,
         telefone nem UTM. -->
    <a class="link bfc-fallback" data-color="blue" data-fallback href="https://go.xperiun.com/subscribe/app-ultra-oferta-novos-bf26">Não foi redirecionado? Aperte aqui!</a>

</main>

<script src="/ed/site-dependencias/anti-copy.js" defer></script>
<!-- Janelas do +1 ano bônus: decidem entre o checkout de 2 anos e o de 1. -->
<script src="/ed/bf/dependencias/bonus.js?v=2"></script>
<script src="/ed/bf/checkout/dependencias/script.js?v=3"></script>
