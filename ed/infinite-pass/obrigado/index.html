<!-- Lettering do infinito ao fundo. É a .ip-imagine-fundo da LP, só que
     ESTÁTICA: lá o script.js atravessa ela pela seção conforme o scroll,
     aqui a página tem uma tela só e ela fica parada. O blur de 12px é o
     mesmo da origem e também é estático, então não cai na regra de não
     animar blur abaixo de 864. -->

<main class="ipo">

    <img src="/ed/infinite-pass/obrigado/dependencias/logo-infinite-pass.svg" alt="Infinite Pass" class="ipo-logo" width="110" height="50" fetchpriority="high" decoding="async">

         árvore de acessibilidade. -->
