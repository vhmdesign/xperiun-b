<!--
     PÁGINA DE PASSAGEM DO CHECKOUT DO ULTRA VITALÍCIO

     A AC redireciona o form 518 (popup da /ed/infinite-pass/oferta/) pra cá.
     Aqui o script pega o email de quem acabou de enviar, pergunta pra
     /api/checkout-vitalicio se ele está na lista "TODOS ALUNOS" da
     ActiveCampaign, e manda pro link de pagamento certo: aluno ou novo.

     A decisão é da Function, não daqui: a chave da AC é server-side e os
     dois links vêm dela. Esta página só obedece o `destino` que recebe.
-->

<!-- Lettering do infinito ao fundo: o mesmo arquivo da página de obrigado,
     referenciado lá (não duplicado) porque é o mesmo cenário do mesmo funil. -->
<div class="ipc-fundo" aria-hidden="true"></div>

<main class="ipc">

    <img src="/ed/infinite-pass/obrigado/dependencias/logo-infinite-pass.svg" alt="Infinite Pass" class="ipc-logo" width="110" height="50" fetchpriority="high" decoding="async">

    <img src="/ed/site-dependencias/site-imagens/Base%20White%20Logo.svg" alt="Xperiun" class="ipc-brand-xp" width="107" height="32" decoding="async">

    <h1 class="ipc-title">Dados recebidos, estamos liberando seu acesso</h1>

    <!-- role="status" pro leitor de tela anunciar a espera; o spinner é
         decorativo e fica fora da árvore de acessibilidade. -->
    <p class="ipc-redirect" role="status">Verificando seu cadastro para aplicar a condição certa. Em instantes você vai para o pagamento.</p>

    <span class="ipc-spinner" aria-hidden="true"></span>

    <!-- Saída manual. Nasce apontando pro link público (o fail-open de toda
         a página) e o script troca pro destino real assim que a verificação
         responde, pra quem clicar antes do redirect não perder o desconto. -->
    <a class="link ipc-fallback" data-color="blue" data-fallback href="https://go.xperiun.com/pay/ultra-vitalicio-novos">Não foi redirecionado? Aperte aqui!</a>

</main>

<script src="/ed/site-dependencias/anti-copy.js" defer></script>
<script src="/ed/infinite-pass/checkout/dependencias/script.js?v=1"></script>
