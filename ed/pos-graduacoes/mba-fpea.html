<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MBA FPEA · Xperiun</title>
    <link rel="icon" type="image/svg+xml" href="../site-dependencias/site-imagens/S%C3%ADmbolo%20Xperiun%20%C3%ACcone.svg">
    <link rel="stylesheet" href="../site-dependencias/root.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,100..700,0..1,0" rel="stylesheet">
    <style>
        /* Garante que viewport units funcionem 100% — sem margem residual */
        html, body { margin: 0; padding: 0; }

        /* ── Hero MBA FPEA: 100vw × 100vh com background de gradient radial
           (mesmo padrão do .depos-faq-wrap::before em formacoes/style.css). */
        .mba-hero {
            position: relative;
            width: 100vw;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            isolation: isolate;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 64px 16px;
            box-sizing: border-box;
            background-color: var(--bb);
        }
        /* 3 orbs decorativas atrás dos stripes. Cada uma é uma elipse
           com radial-gradient da cor → transparente. Posicionadas em
           pontos diferentes do hero e respondem ao mouse via --mx/--my
           (mouse parallax, desktop only). */
        .mba-hero-orbs {
            position: absolute;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }
        .mba-orb {
            position: absolute;
            /* filter: blur(64px); */
            /* translate vem ANTES do rotate na lista (aplicado depois
               do rotate matematicamente) pra que o movimento aconteça
               em world-space — mouse-right = orb-right, independente
               da rotação individual de cada orb. */
            transition: transform 0.35s ease-out;
        }
        .mba-orb--1 {
            height: 120%;
            aspect-ratio: 2 / 1.5;
            transform: translate(var(--mx, 0px), var(--my, 0px)) rotate(15deg);
            top: -40%;
            left: -30%;
            background:  radial-gradient(ellipse, var(--pc500) 0%, transparent 50%);
        }
        .mba-orb--2 {
            height: 80%;
            aspect-ratio: 2 / 1.5;
            transform: translate(var(--mx, 0px), var(--my, 0px)) rotate(-45deg);
            bottom: -20%;
            left: 30%;
            background:  radial-gradient(ellipse, var(--pc500) 0%, transparent 50%);
        }
        .mba-orb--3 {
            height: 170%;
            aspect-ratio: 1 / 2;
            transform: translate(var(--mx, 0px), var(--my, 0px)) rotate(135deg);
            top: -70%;
            right: 0%;
            background:  radial-gradient(ellipse, var(--pc500) 0%, transparent 50%);
        }

        /* Laptop — ≤1439px. Só overrides do desktop. */
        @media (max-width: 1439px) {
            .mba-orb--1 { left: -50%; }
            .mba-orb--3 { right: -20%; }
        }

        /* Tablet — ≤864px. Só overrides (herda do 1439 acima). */
        @media (max-width: 864px) {
            .mba-orb--1 {
                top: -60%;
                left: -80%;
            }
            .mba-orb--3 {
                height: 100%;
                top: auto;
                bottom: -30%;
                left: -30%;
            }
        }

        /* Layer de stripes entre o ::before (gradient blur) e o conteúdo.
           18 divs flex iguais, cada uma com radial-gradient transparente
           ao centro → var(--bb) nas bordas. Cria efeito de "vignette
           ripple" cobrindo o gradient de fundo. z-index: 0 (acima do
           ::before z:-1, abaixo do content z:1). */
        .mba-hero-stripes {
            position: absolute;
            inset: 0;
            z-index: 0;
            display: flex;
            gap: 0;
            pointer-events: none;
        }
        .mba-hero-stripes > div {
            flex: 1 1 0;
            height: 100%;
            background: radial-gradient(ellipse, transparent 0%, var(--bb) 100%);
            background-size: 200% 100%;
            background-position: 0% 0%;

        }
        .mba-hero-content {
            position: relative;
            z-index: 1;
            max-width: 832px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 24px;
        }
        .mba-hero-tag {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 1920px;
            background-color: rgba(150, 0, 255, 0.25);
            color: var(--pp200);
            font: var(--label-s);
            font-weight: 500;
        }
        .mba-hero-logo {
            width: 240px;
            height: auto;
            display: block;
            opacity: 0.95;
        }
        .mba-hero-h1 {
            font: var(--h2);
            font-weight: 300;
            color: var(--bw);
            margin: 0;
            max-width: 24ch;
        }
        .mba-hero-h1 strong { font-weight: 700; }
        .mba-hero-p {
            font: var(--p);
            color: var(--bw-75);
            margin: 0;
            max-width: 56ch;
        }
        .mba-hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            justify-content: center;
            margin-top: 16px;
        }
    </style>
</head>
<body>

<section class="mba-hero">
    <div class="mba-hero-orbs" aria-hidden="true">
        <div class="mba-orb mba-orb--1"></div>
        <div class="mba-orb mba-orb--2"></div>
        <div class="mba-orb mba-orb--3"></div>
    </div>
    <div class="mba-hero-stripes" aria-hidden="true"></div>
    <div class="mba-hero-content">
        <img src="../site-dependencias/site-imagens/MBA Logo.svg" alt="MBA Xperiun" class="mba-hero-logo">
        <span class="mba-hero-tag">Pós-Graduação · Certificado MEC via UNIFATEC</span>
        <h1 class="mba-hero-h1">MBA em <strong>BI &amp; Analytics 360</strong></h1>
        <p class="mba-hero-p">Formação executiva em dados aplicada a negócio. Da arquitetura técnica à decisão estratégica em 12 meses.</p>
        <div class="mba-hero-actions">
            <a class="btn" data-size="m" data-emphasis="high">Quero conhecer o MBA</a>
            <a class="btn" data-size="m" data-emphasis="subtle">Baixar grade curricular</a>
        </div>
    </div>
</section>

<div data-menu></div>
<script src="../site-dependencias/site-menu/menu-include.js"></script>
<script src="../site-dependencias/scroll-suave.js"></script>

<script>
    /* Mouse parallax nas .mba-orb — desktop only. Mapeia posição do
       cursor relativa ao centro do hero pro range ±64px em cada eixo.
       CSS variables --mx/--my no .mba-hero são lidas pelas orbs no
       transform: translate(var(--mx), var(--my)) rotate(...). */
    (function () {
        if (!window.matchMedia('(pointer: fine)').matches) return;

        var hero = document.querySelector('.mba-hero');
        if (!hero) return;

        var MAX = 64;
        var rafId = null;
        var targetX = 0, targetY = 0;

        function apply() {
            rafId = null;
            hero.style.setProperty('--mx', targetX + 'px');
            hero.style.setProperty('--my', targetY + 'px');
        }

        hero.addEventListener('mousemove', function (e) {
            var rect = hero.getBoundingClientRect();
            var halfW = rect.width / 2;
            var halfH = rect.height / 2;
            var dx = (e.clientX - rect.left - halfW) / halfW;  // -1 a 1
            var dy = (e.clientY - rect.top  - halfH) / halfH;  // -1 a 1
            /* Clamp e multiplica pelo MAX. dx/dy podem passar de ±1
               se mouse sair do bbox antes do mouseleave disparar. */
            targetX = Math.max(-1, Math.min(1, dx)) * MAX;
            targetY = Math.max(-1, Math.min(1, dy)) * MAX;
            if (rafId === null) rafId = requestAnimationFrame(apply);
        });

        hero.addEventListener('mouseleave', function () {
            targetX = 0;
            targetY = 0;
            if (rafId === null) rafId = requestAnimationFrame(apply);
        });
    })();

    /* Stripes dinâmicos no .mba-hero-stripes. flex:1 1 0 distribui width
       igualmente entre filhos, então só precisamos escolher a contagem
       certa pra cada stripe ficar entre MIN e MAX px. ResizeObserver
       re-roda em resize do hero (window resize, viewportvh changes etc). */
    (function () {
        var stripes = document.querySelector('.mba-hero-stripes');
        if (!stripes) return;

        var MIN = 96;
        var MAX = 128;
        var TARGET = (MIN + MAX) / 2;
        var currentCount = -1;

        function pickCount(W) {
            if (W <= 0) return 0;
            /* Range válido: ceil(W/MAX) ≤ count ≤ floor(W/MIN). */
            var minCount = Math.ceil(W / MAX);
            var maxCount = Math.floor(W / MIN);
            if (maxCount >= minCount) {
                /* Meio do range → transição estável entre breakpoints. */
                return Math.floor((minCount + maxCount) / 2);
            }
            /* Range vazio (W em faixas tipo 129–191 onde 1 stripe > MAX
               mas 2 stripes < MIN). Fallback: o que chega mais perto. */
            return Math.max(1, Math.round(W / TARGET));
        }

        function update() {
            var W = stripes.clientWidth;
            var count = pickCount(W);
            if (count === currentCount) return;

            if (count > currentCount) {
                var frag = document.createDocumentFragment();
                for (var i = stripes.children.length; i < count; i++) {
                    frag.appendChild(document.createElement('div'));
                }
                stripes.appendChild(frag);
            } else {
                while (stripes.children.length > count) {
                    stripes.removeChild(stripes.lastChild);
                }
            }
            currentCount = count;
        }

        update();
        if (window.ResizeObserver) {
            new ResizeObserver(update).observe(stripes);
        } else {
            window.addEventListener('resize', update);
        }
    })();
</script>
