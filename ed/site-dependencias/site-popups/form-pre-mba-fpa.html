<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pré-MBA FP&amp;A, Xperiun</title>
    <link rel="stylesheet" href="../root.css">
    <link rel="stylesheet" href="form.css">
    <style>body { margin: 0; background: var(--bb); min-height: 100vh; }</style>
</head>
<body>

<!-- Form ActiveCampaign do Pré-MBA FP&A (/ed/pre-mba-fpa/).
     Id do form na AC: 516. É o form curto: só o trio nome, email e
     telefone, todos required, sem campo de qualificação.

     Mapa dos field[N], tirado do window.cfields do embed da AC. NÃO
     chutar nenhum destes números, eles são por-conta na AC:
       field[2] utm_campaign   field[3] utm_source
       field[4] utm_medium     field[5] utm_content

     Este form NÃO tem field[60] (sck) nem field[103] (utm_term), que
     outros da casa têm. O form.js tenta preencher os seis da URL e pula
     em silêncio os que não existem no HTML, então não falta nada.

     O 'or' é o UUID real do form na AC, que veio no embed. Nos popups
     mais antigos ele está vazio com um TODO; aqui já foi possível
     preencher.

     A máscara e a normalização do telefone pra E.164 (+55) são do
     form.js, não deste arquivo: o embed da AC usa intl-tel-input, que
     não carregamos. Mesma coisa pro redirect do sucesso, que vem da
     própria AC e não é forçado aqui.

     O acento do card é o verde desta página (--pre-gr500 #00FF64), e não
     o pc300 dos outros popups, pra o modal ler como continuação da
     landing. O logo é o claro, que é o que se lê sobre o bb do modal. -->
<div class="popup-form" id="popup-form-pre-mba-fpa" style="--popup-accent-rgb: 0, 255, 100;">
    <div class="popup-form-backdrop"></div>
    <div class="popup-form-content">
        <div class="popup-form-card">
            <div class="popup-form-header">
                <img src="/ed/pre-mba-fpa/dependencias/logo-claro.webp" alt="Pré-MBA FP&amp;A" class="popup-form-logo" width="180" height="36" style="width: 180px; height: auto; display: block;">
            </div>
            <p class="popup-form-label">Preencha seus dados abaixo:</p>
            <form
                class="popup-form-form _form _form_516 _inline-form _dark"
                id="_form_516_"
                method="POST"
                action="https://karpinskileonardo.activehosted.com/proc.php"
                novalidate
            >
                <input type="hidden" name="u" value="516">
                <input type="hidden" name="f" value="516">
                <input type="hidden" name="s">
                <input type="hidden" name="c" value="0">
                <input type="hidden" name="m" value="0">
                <input type="hidden" name="act" value="sub">
                <input type="hidden" name="v" value="2">
                <input type="hidden" name="or" value="e8dce15a-4a1d-49be-accb-ea8ded8f9734">

                <input type="hidden" name="field[2]" value="">
                <input type="hidden" name="field[3]" value="">
                <input type="hidden" name="field[4]" value="">
                <input type="hidden" name="field[5]" value="">

                <div class="input-group">
                    <span class="input-label">Nome</span>
                    <input name="fullname" class="input" type="text" placeholder="Digite seu nome" autocomplete="name" required>
                    <span class="input-error-text" style="display:none">Informe seu nome.</span>
                </div>

                <div class="input-group">
                    <span class="input-label">Email</span>
                    <input name="email" class="input" type="email" placeholder="Digite seu e-mail" autocomplete="email" required>
                    <span class="input-error-text" style="display:none">Insira um email válido.</span>
                </div>

                <div class="input-group">
                    <span class="input-label">WhatsApp</span>
                    <input name="phone" class="input" type="tel" placeholder="(11) 99999-9999" autocomplete="tel" inputmode="numeric" maxlength="15" required>
                    <span class="input-error-text" style="display:none">Informe um WhatsApp válido com DDD.</span>
                </div>

                <div class="popup-form-actions">
                    <button type="button" class="btn popup-form-cancel" data-size="m" data-emphasis="subtle">Cancelar</button>
                    <button type="submit" class="btn" data-size="m" data-emphasis="medium-core" id="_form_516_submit">Confirmar</button>
                </div>
            </form>
            <p class="popup-form-success" hidden>Aguarde um instante, você será redirecionado...</p>
        </div>
    </div>
</div>

<script src="form.js"></script>

</body>
</html>
