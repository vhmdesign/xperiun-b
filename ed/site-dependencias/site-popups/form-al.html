<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combo Logística</title>
    <link rel="stylesheet" href="../root.css">
    <link rel="stylesheet" href="form.css">
    <link href="/ed/site-dependencias/site-fonts/material-symbols.css" rel="stylesheet">
    <style>body { margin: 0; background: var(--bb); min-height: 100vh; }</style>
</head>
<body>

<!-- PLACEHOLDER (combo Logística). Trocar os campos da ActiveCampaign (u/f/action/fields)
     pelos reais quando vier o id correto do form desta área. -->
<div class="popup-form" id="popup-form-al" style="--popup-accent-rgb: 100, 100, 255;">
    <div class="popup-form-backdrop"></div>
    <div class="popup-form-content">
        <div class="popup-form-card">
            <div class="popup-form-header">
                <div class="popup-form-icon-box">
                    <span class="material-symbols-outlined" style="font-size: 24px; color: var(--pc300);">local_shipping</span>
                </div>
                <div class="popup-form-eyebrow">
                    <span class="tag-status" data-semantic="neutral" data-size="m">Combo Logística</span>
                </div>
            </div>
            <p class="popup-form-label">Preencha seus dados abaixo:</p>
            <form
                class="popup-form-form _form _form_493 _inline-form _dark"
                id="_form_493_"
                method="POST"
                action="https://karpinskileonardo.activehosted.com/proc.php"
                novalidate
            >
                <input type="hidden" name="u" value="493">
                <input type="hidden" name="f" value="493">
                <input type="hidden" name="s">
                <input type="hidden" name="c" value="0">
                <input type="hidden" name="m" value="0">
                <input type="hidden" name="act" value="sub">
                <input type="hidden" name="v" value="2">
                <input type="hidden" name="or" value="">

                <div class="input-group">
                    <span class="input-label">Nome</span>
                    <input name="fullname" class="input" type="text" placeholder="Seu nome completo" autocomplete="name" required>
                    <span class="input-error-text" style="display:none">Informe seu nome.</span>
                </div>

                <div class="input-group">
                    <span class="input-label">Email</span>
                    <input name="email" class="input" type="email" placeholder="you@domain.com" autocomplete="email" required>
                    <span class="input-error-text" style="display:none">Insira um email válido.</span>
                </div>

                <div class="input-group">
                    <span class="input-label">WhatsApp</span>
                    <input name="phone" class="input" type="tel" placeholder="(11) 99999-9999" autocomplete="tel" inputmode="numeric" maxlength="15" required>
                    <span class="input-error-text" style="display:none">Informe um WhatsApp válido com DDD.</span>
                </div>

                <div class="input-group">
                    <div class="g-recaptcha" data-sitekey="6LcwIw8TAAAAACP1ysM08EhCgzd6q5JAOUR1a0Go"></div>
                </div>

                <div class="popup-form-actions">
                    <button type="button" class="btn popup-form-cancel" data-size="m" data-emphasis="subtle">Cancelar</button>
                    <button type="submit" class="btn" data-size="m" data-emphasis="medium-core" id="_form_493_submit">Confirmar</button>
                </div>
            </form>
            <p class="popup-form-success" hidden>Você será redirecionado para o checkout...</p>
        </div>
    </div>
</div>

<script src="form.js"></script>

</body>
</html>
